name: Build Linux packages

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-tk
      - name: Validate Python and shell scripts
        run: |
          python3 -m py_compile niri_theme_manager.py tests/test_config.py
          python3 -m unittest discover -s tests -v
          bash -n install-linux.sh install-arch.sh packaging/build-deb.sh packaging/build-rpm.sh
          sh -n run.sh
      - name: Build Debian package
        run: bash packaging/build-deb.sh
      - name: Inspect package
        run: dpkg-deb --contents dist/niri-theme-manager_0.1.0-1_all.deb
      - uses: actions/upload-artifact@v4
        with:
          name: debian-package
          path: dist/*.deb

  rpm:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install RPM build tools
        run: dnf install -y git rpm-build python3-tkinter tar gzip
      - name: Build RPM package
        run: bash packaging/build-rpm.sh
      - name: Inspect package
        run: rpm -qpl dist/*.rpm
      - uses: actions/upload-artifact@v4
        with:
          name: rpm-package
          path: dist/*.rpm
